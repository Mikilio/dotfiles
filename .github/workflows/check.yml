name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v15
        with:
          name: mikilio
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Run checks
        shell: bash
        run: |
          set -o pipefail
          # --accept-flake-config: use the substituters declared in flake.nix
          # (incl. mikilio.cachix.org) instead of building from source.
          # Evaluation warnings (e.g. upstream deprecations) are not failures;
          # filter them out of the log so they can't pollute CI output.
          nix flake check --accept-flake-config --print-build-logs 2>&1 \
            | grep -v -E 'evaluation warning:|trace: Obsolete option'
